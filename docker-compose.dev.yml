# =============================================================================
# My-Invest Dashboard - Development Docker Compose
# =============================================================================
# This configuration sets up a development-friendly environment with:
# - Hot reload for frontend (Vite dev server)
# - Volume mounts for live code changes
# - Debug-friendly settings
# - Exposed ports for all services
# =============================================================================

services:
  # ===========================================================================
  # Frontend Development Service
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: my-invest-frontend-dev
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_BASE_URL=http://localhost:8080/api
      - VITE_WS_URL=ws://localhost:8080/ws
    depends_on:
      - backend
    stdin_open: true
    tty: true
    restart: unless-stopped
    networks:
      - my-invest-network

  # ===========================================================================
  # Backend Development Service
  # ===========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: my-invest-backend-dev
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - backend_cargo_cache:/usr/local/cargo/registry
      - backend_target_cache:/app/target
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - DATABASE_URL=mongodb://mongodb:27017/myinvest
      - REDIS_URL=redis://redis:6379
      - FRONTEND_URL=http://localhost:3000
      - RUST_LOG=debug
      - RUST_BACKTRACE=1
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    stdin_open: true
    tty: true
    restart: unless-stopped
    networks:
      - my-invest-network

  # ===========================================================================
  # MongoDB Database Service (Development)
  # ===========================================================================
  mongodb:
    image: mongo:7
    container_name: my-invest-mongodb-dev
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=myinvest
    volumes:
      - mongodb_data_dev:/data/db
      - mongodb_config_dev:/data/configdb
    restart: unless-stopped
    networks:
      - my-invest-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    command: ["mongod", "--bind_ip_all"]

  # ===========================================================================
  # Redis Cache Service (Development)
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: my-invest-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_data_dev:/data
    restart: unless-stopped
    networks:
      - my-invest-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    command: ["redis-server", "--appendonly", "yes"]

  # ===========================================================================
  # MongoDB Express (Web-based MongoDB Admin Interface)
  # ===========================================================================
  mongo-express:
    image: mongo-express:latest
    container_name: my-invest-mongo-express
    ports:
      - "8081:8081"
    environment:
      - ME_CONFIG_MONGODB_SERVER=mongodb
      - ME_CONFIG_MONGODB_PORT=27017
      - ME_CONFIG_BASICAUTH_USERNAME=admin
      - ME_CONFIG_BASICAUTH_PASSWORD=admin
    depends_on:
      mongodb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - my-invest-network

  # ===========================================================================
  # Redis Commander (Web-based Redis Admin Interface)
  # ===========================================================================
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: my-invest-redis-commander
    ports:
      - "8082:8081"
    environment:
      - REDIS_HOSTS=local:redis:6379
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - my-invest-network

# =============================================================================
# Networks
# =============================================================================
networks:
  my-invest-network:
    driver: bridge
    name: my-invest-network-dev

# =============================================================================
# Volumes
# =============================================================================
volumes:
  mongodb_data_dev:
    name: my-invest-mongodb-data-dev
  mongodb_config_dev:
    name: my-invest-mongodb-config-dev
  redis_data_dev:
    name: my-invest-redis-data-dev
  backend_cargo_cache:
    name: my-invest-backend-cargo-cache
  backend_target_cache:
    name: my-invest-backend-target-cache
