[package]
name = "my-invest-backend"
version = "0.1.0"
edition = "2021"
authors = ["My-Invest Team"]
description = "Backend API for My-Invest Dashboard"

[dependencies]
# Web framework (Axum)
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Async runtime
tokio = { version = "1.36", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database clients
mongodb = "2.8"
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }

# Environment and configuration
dotenvy = "0.15"
config = "0.14"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Date and time
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.7", features = ["v4", "serde"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Validation
validator = { version = "0.18", features = ["derive"] }

# Security
argon2 = "0.4"
jsonwebtoken = "9.2"

# Rate limiting
governor = "0.6"

# HTTP client (for external APIs)
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }

[dev-dependencies]
# Testing
tokio-test = "0.4"
wiremock = "0.5"
once_cell = "1.19"
serial_test = "3.0"
fake = { version = "2.9", features = ["derive"] }
claim = "0.5"
quickcheck = "1.0"
quickcheck_macros = "1.0"

# Test utilities
tower = { version = "0.4", features = ["util"] }
axum-test = "14.0"
testcontainers = "0.15"
testcontainers-modules = { version = "0.3", features = ["mongo", "redis"] }

[profile.dev]
opt-level = 0
debug = true

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true

[profile.test]
opt-level = 0
debug = true
