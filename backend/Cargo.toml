[package]
name = "my-invest-backend"
version = "0.1.0"
edition = "2021"
authors = ["My-Invest Team"]
description = "Backend API server for My-Invest Dashboard"
license = "MIT"
repository = "https://github.com/my-invest/my-invest"

[dependencies]
# Web Framework
axum = { version = "0.7", features = ["macros"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tower = { version = "0.4", features = ["util", "timeout", "limit"] }
tower-http = { version = "0.5", features = ["cors", "trace", "request-id", "util"] }
hyper = { version = "1.0", features = ["full"] }

# Async Runtime
tokio = { version = "1", features = ["full", "macros", "rt-multi-thread"] }

# Database
mongodb = { version = "2.8", features = ["bson-chrono-0_4"] }
redis = { version = "0.24", features = ["tokio-comp", "connection-manager"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Authentication & Security
jsonwebtoken = "9.2"
argon2 = "0.5"

# HTTP Client (for Alpha Vantage)
reqwest = { version = "0.11", default-features = false, features = ["json", "rustls-tls"] }

# Validation
validator = { version = "0.18", features = ["derive"] }

# Logging & Tracing
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# Rate Limiting
governor = "0.6"

# Environment & Configuration
dotenvy = "0.15"
config = "0.14"

# Date & Time
chrono = { version = "0.4", features = ["serde"] }

# UUID Generation
uuid = { version = "1.6", features = ["v4", "serde"] }

# Error Handling
thiserror = "1.0"
anyhow = "1.0"

# Futures & Async Utilities
futures = "0.3"
async-trait = "0.1"

# Password Reset Token Generation
rand = "0.8"
base64 = "0.21"

[dev-dependencies]
# Testing
tokio-test = "0.4"
wiremock = "0.5"
once_cell = "1.19"
serial_test = "3.0"
fake = { version = "2.9", features = ["derive"] }
claim = "0.5"
quickcheck = "1.0"
quickcheck_macros = "1.0"

# Test utilities
tower = { version = "0.4", features = ["util"] }
axum-test = "14.0"
testcontainers = "0.15"
testcontainers-modules = { version = "0.3", features = ["mongo", "redis"] }

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

[profile.test]
opt-level = 0
debug = true
