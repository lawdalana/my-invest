[package]
name = "my-invest-backend"
version = "0.1.0"
edition = "2021"
authors = ["My-Invest Team"]
description = "Backend API for My-Invest Dashboard"

[dependencies]
# Web framework
actix-web = "4.5"
actix-cors = "0.7"
actix-rt = "2.9"

# Async runtime
tokio = { version = "1.36", features = ["full"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database clients (placeholder - will be used later)
mongodb = "2.8"
redis = { version = "0.25", features = ["tokio-comp", "connection-manager"] }

# Environment and configuration
dotenvy = "0.15"
config = "0.14"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Date and time
chrono = { version = "0.4", features = ["serde"] }

# UUID generation
uuid = { version = "1.7", features = ["v4", "serde"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Security (placeholder for future auth)
argon2 = "0.4"
jsonwebtoken = "9.2"

[dev-dependencies]
actix-rt = "2.9"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
