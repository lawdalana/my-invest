# =============================================================================
# My-Invest Dashboard - Production Docker Compose
# =============================================================================
# This configuration sets up the complete production stack:
# - Frontend: React PWA served via Nginx
# - Backend: Rust API server
# - MongoDB: Primary database
# - Redis: Caching and real-time data
# =============================================================================

services:
  # ===========================================================================
  # Frontend Service
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: my-invest-frontend
    ports:
      - "3000:80"
    environment:
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - my-invest-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ===========================================================================
  # Backend API Service
  # ===========================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: my-invest-backend
    ports:
      - "8080:8080"
    environment:
      - HOST=0.0.0.0
      - PORT=8080
      - DATABASE_URL=mongodb://mongodb:27017/myinvest
      - REDIS_URL=redis://redis:6379
      - FRONTEND_URL=http://localhost:3000
      - RUST_LOG=info
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - my-invest-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # ===========================================================================
  # MongoDB Database Service
  # ===========================================================================
  mongodb:
    image: mongo:7
    container_name: my-invest-mongodb
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_DATABASE=myinvest
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    restart: unless-stopped
    networks:
      - my-invest-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    command: ["mongod", "--bind_ip_all"]

  # ===========================================================================
  # Redis Cache Service
  # ===========================================================================
  redis:
    image: redis:7-alpine
    container_name: my-invest-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - my-invest-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]

# =============================================================================
# Networks
# =============================================================================
networks:
  my-invest-network:
    driver: bridge
    name: my-invest-network

# =============================================================================
# Volumes
# =============================================================================
volumes:
  mongodb_data:
    name: my-invest-mongodb-data
  mongodb_config:
    name: my-invest-mongodb-config
  redis_data:
    name: my-invest-redis-data
